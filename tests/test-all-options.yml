name: Test all options with unsupported event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # All PR-related options set; event is still workflow_dispatch under act,
      # so the action must still fail with "Event ... is not supported".
      - id: action
        uses: .
        continue-on-error: true
        with:
          pattern: '^(feat|fix|docs|chore)(\(.+\))?: .+$'
          flags: 'gm'
          error: 'Commit message must follow conventional commits'
          excludeTitle: 'true'
          excludeDescription: 'true'
          checkAllCommitMessages: 'false'
      - name: Assert action failed on unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
