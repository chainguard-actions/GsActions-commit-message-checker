name: Test push with valid commit messages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_EVENT_PATH: ${{ github.workspace }}/tests/fixtures/push-valid.json
        with:
          pattern: '^\[(TASK|BUGFIX)\] .+$'
          error: 'Commit message must start with [TASK] or [BUGFIX]'
      - name: Report action outcome (event override may be ignored by act)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Run shipped entrypoint with push payload and assert success
        env:
          INPUT_PATTERN: '^\[(TASK|BUGFIX)\] .+$'
          INPUT_FLAGS: gm
          INPUT_ERROR: 'Commit message must start with [TASK] or [BUGFIX]'
          INPUT_EXCLUDETITLE: 'false'
          INPUT_EXCLUDEDESCRIPTION: 'false'
          INPUT_CHECKALLCOMMITMESSAGES: 'false'
          INPUT_ACCESSTOKEN: 'false'
        run: |
          set +e
          OUT=$(GITHUB_EVENT_NAME=push GITHUB_EVENT_PATH="$GITHUB_WORKSPACE/tests/fixtures/push-valid.json" node "$GITHUB_WORKSPACE/dist/index.js" 2>&1)
          RC=$?
          echo "rc: $RC"
          echo "$OUT"
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: expected exit 0"
            exit 1
          fi
          if ! echo "$OUT" | grep -q -- '- OK: "\[TASK\] Add new feature"'; then
            echo "FAIL: expected OK line for first commit"
            exit 1
          fi
          if echo "$OUT" | grep -q -- '- failed:'; then
            echo "FAIL: no commit should fail"
            exit 1
          fi
          echo "PASS"
