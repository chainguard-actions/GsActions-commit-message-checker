name: Test push with an invalid commit message
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Fails either because the message is invalid, or (if act ignores the
      # event override) because workflow_dispatch is unsupported. Never success.
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_EVENT_PATH: ${{ github.workspace }}/tests/fixtures/push-invalid.json
        with:
          pattern: '^\[(TASK|BUGFIX)\] .+$'
          error: 'Commit message must start with [TASK] or [BUGFIX]'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"
            exit 1
          fi
          echo "PASS"
      - name: Run shipped entrypoint with invalid push payload and assert error
        env:
          INPUT_PATTERN: '^\[(TASK|BUGFIX)\] .+$'
          INPUT_FLAGS: gm
          INPUT_ERROR: 'Commit message must start with [TASK] or [BUGFIX]'
        run: |
          set +e
          OUT=$(GITHUB_EVENT_NAME=push GITHUB_EVENT_PATH="$GITHUB_WORKSPACE/tests/fixtures/push-invalid.json" node "$GITHUB_WORKSPACE/dist/index.js" 2>&1)
          RC=$?
          echo "rc: $RC"
          echo "$OUT"
          if [ "$RC" -eq 0 ]; then
            echo "FAIL: expected non-zero exit"
            exit 1
          fi
          if ! echo "$OUT" | grep -q -- '- failed: "fixed stuff without prefix"'; then
            echo "FAIL: expected failed line for invalid commit"
            exit 1
          fi
          if ! echo "$OUT" | grep -qF 'Commit message must start with [TASK] or [BUGFIX]'; then
            echo "FAIL: expected custom error message"
            exit 1
          fi
          echo "PASS"
