name: Test pull_request with excludeTitle
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_EVENT_PATH: ${{ github.workspace }}/tests/fixtures/pr-bad-title.json
        with:
          pattern: '^\[TASK\] '
          flags: 'g'
          error: 'PR description must start with [TASK]'
          excludeTitle: 'true'
      - name: Report action outcome (event override may be ignored by act)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Run shipped entrypoint with PR payload and excludeTitle=true
        env:
          INPUT_PATTERN: '^\[TASK\] '
          INPUT_FLAGS: 'g'
          INPUT_ERROR: 'PR description must start with [TASK]'
          INPUT_EXCLUDETITLE: 'true'
          INPUT_EXCLUDEDESCRIPTION: 'false'
          INPUT_CHECKALLCOMMITMESSAGES: 'false'
        run: |
          set +e
          OUT=$(GITHUB_EVENT_NAME=pull_request GITHUB_EVENT_PATH="$GITHUB_WORKSPACE/tests/fixtures/pr-bad-title.json" node "$GITHUB_WORKSPACE/dist/index.js" 2>&1)
          RC=$?
          echo "rc: $RC"
          echo "$OUT"
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: expected exit 0 when title excluded"
            exit 1
          fi
          if ! echo "$OUT" | grep -qF -- '- OK: "[TASK] Description that matches"'; then
            echo "FAIL: expected OK line for description only"
            exit 1
          fi
          echo "PASS"
