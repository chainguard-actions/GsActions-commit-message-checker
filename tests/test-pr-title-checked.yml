name: Test pull_request title is checked
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_EVENT_PATH: ${{ github.workspace }}/tests/fixtures/pr-bad-title.json
        with:
          pattern: '^\[TASK\] '
          flags: 'g'
          error: 'PR title must start with [TASK]'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"
            exit 1
          fi
          echo "PASS"
      - name: Run shipped entrypoint with PR payload (title included)
        env:
          INPUT_PATTERN: '^\[TASK\] '
          INPUT_FLAGS: 'g'
          INPUT_ERROR: 'PR title must start with [TASK]'
          INPUT_EXCLUDETITLE: 'false'
          INPUT_EXCLUDEDESCRIPTION: 'false'
          INPUT_CHECKALLCOMMITMESSAGES: 'false'
        run: |
          set +e
          OUT=$(GITHUB_EVENT_NAME=pull_request GITHUB_EVENT_PATH="$GITHUB_WORKSPACE/tests/fixtures/pr-bad-title.json" node "$GITHUB_WORKSPACE/dist/index.js" 2>&1)
          RC=$?
          echo "rc: $RC"
          echo "$OUT"
          if [ "$RC" -eq 0 ]; then
            echo "FAIL: expected non-zero exit"
            exit 1
          fi
          if ! echo "$OUT" | grep -q -- '- failed: "bad title without prefix'; then
            echo "FAIL: expected failed line starting with PR title"
            exit 1
          fi
          if ! echo "$OUT" | grep -qF 'PR title must start with [TASK]'; then
            echo "FAIL: expected custom error message"
            exit 1
          fi
          echo "PASS"
