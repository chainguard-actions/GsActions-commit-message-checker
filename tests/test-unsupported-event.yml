name: Test unsupported event (workflow_dispatch)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Under the harness the event is always workflow_dispatch, which the
      # action does not support: it must fail with 'Event "..." is not supported.'
      - id: action
        uses: .
        continue-on-error: true
        with:
          pattern: '^\[(TASK|BUGFIX)\] .+$'
          error: 'Commit message must start with [TASK] or [BUGFIX]'
      - name: Assert action failed on unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported workflow_dispatch event"
            exit 1
          fi
          echo "PASS"
      - name: Assert entrypoint reports unsupported event message
        env:
          INPUT_PATTERN: '^\[(TASK|BUGFIX)\] .+$'
          INPUT_FLAGS: gm
          INPUT_ERROR: 'Commit message must start with [TASK] or [BUGFIX]'
        run: |
          set +e
          OUT=$(GITHUB_EVENT_NAME=workflow_dispatch node "$GITHUB_WORKSPACE/dist/index.js" 2>&1)
          RC=$?
          echo "rc: $RC"
          echo "$OUT"
          if [ "$RC" -eq 0 ]; then
            echo "FAIL: expected non-zero exit"
            exit 1
          fi
          if ! echo "$OUT" | grep -q 'Event "workflow_dispatch" is not supported'; then
            echo "FAIL: expected unsupported event message"
            exit 1
          fi
          echo "PASS"
