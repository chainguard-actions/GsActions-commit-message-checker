name: Test unsupported event (workflow_dispatch) fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The action only supports push / pull_request / pull_request_target.
      # Under act, github.context.eventName is always workflow_dispatch, so
      # the action must reject the event with setFailed.
      - id: action
        uses: .
        continue-on-error: true
        with:
          pattern: '^.+$'
          error: 'Commit message must not be empty'
      - name: Assert action failed on unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported workflow_dispatch event, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
