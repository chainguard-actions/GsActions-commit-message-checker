name: Test invalid regex flags are rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_EVENT_PATH: ${{ github.workspace }}/tests/fixtures/push-valid.json
        with:
          pattern: '^\[(TASK|BUGFIX)\] .+$'
          flags: 'gxz'
          error: 'Commit message must start with [TASK] or [BUGFIX]'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"
            exit 1
          fi
          echo "PASS"
      - name: Run shipped entrypoint with invalid flags and assert error
        env:
          INPUT_PATTERN: '^\[(TASK|BUGFIX)\] .+$'
          INPUT_FLAGS: 'gxz'
          INPUT_ERROR: 'Commit message must start with [TASK] or [BUGFIX]'
        run: |
          set +e
          OUT=$(GITHUB_EVENT_NAME=push GITHUB_EVENT_PATH="$GITHUB_WORKSPACE/tests/fixtures/push-valid.json" node "$GITHUB_WORKSPACE/dist/index.js" 2>&1)
          RC=$?
          echo "rc: $RC"
          echo "$OUT"
          if [ "$RC" -eq 0 ]; then
            echo "FAIL: expected non-zero exit"
            exit 1
          fi
          if ! echo "$OUT" | grep -q 'FLAGS contains invalid characters "xz"'; then
            echo "FAIL: expected invalid flags message"
            exit 1
          fi
          echo "PASS"
