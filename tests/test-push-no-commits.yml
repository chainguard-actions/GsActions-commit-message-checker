name: Test push with no commits skips check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run shipped entrypoint with empty commits payload
        env:
          INPUT_PATTERN: '^\[(TASK|BUGFIX)\] .+$'
          INPUT_FLAGS: gm
          INPUT_ERROR: 'Commit message must start with [TASK] or [BUGFIX]'
        run: |
          set +e
          OUT=$(GITHUB_EVENT_NAME=push GITHUB_EVENT_PATH="$GITHUB_WORKSPACE/tests/fixtures/push-no-commits.json" node "$GITHUB_WORKSPACE/dist/index.js" 2>&1)
          RC=$?
          echo "rc: $RC"
          echo "$OUT"
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: expected exit 0"
            exit 1
          fi
          if ! echo "$OUT" | grep -q 'No commits found in the payload, skipping check.'; then
            echo "FAIL: expected skip message"
            exit 1
          fi
          echo "PASS"
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_EVENT_PATH: ${{ github.workspace }}/tests/fixtures/push-no-commits.json
        with:
          pattern: '^\[(TASK|BUGFIX)\] .+$'
          error: 'Commit message must start with [TASK] or [BUGFIX]'
      - name: Report action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
